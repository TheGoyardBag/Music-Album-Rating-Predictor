[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "album-ratings"
version = "0.1.0"
description = "Predict album ratings from descriptive tags with reproducible, artist-disjoint evaluation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.8,<1.9",
  "joblib>=1.4,<2", "fastapi>=0.128,<1", "uvicorn>=0.30,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]
[project.scripts]
album-ratings = "album_ratings.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
album_ratings = ["static/*.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
